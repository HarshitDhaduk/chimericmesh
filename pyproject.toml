[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chimericmesh"
version = "0.1.0"
description = "Legacy protocols (Syslog, IRC, Telnet) stitched to AI agents via MCP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chimericmesh = ["web/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: benchmark tests (skip with CHIMERICMESH_SKIP_BENCH=1)"]
